apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-bookstore
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: bookstore-container
          image: hsri123/online-bookstore:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10